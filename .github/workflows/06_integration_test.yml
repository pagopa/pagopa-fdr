name: Integration Tests

on:
  schedule:
    - cron: '00 08 * * *'

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
      tags:
        description: 'Behave tag expression of the tests to run (e.g. @runnable)'
        required: false
        type: string
        default: '@runnable'
      notify:
        required: false
        type: boolean
        description: 'send the slack notification'
        default: false


permissions:
  contents: read


jobs:
  # The FDR3 integration tests are executed by the Test Automation Service (TAS)
  # through its composite action. Sync mode: the step fails if any scenario fails.
  integration_test:
    name: Test ${{ inputs.environment || 'dev' }} (TAS)
    runs-on: ubuntu-latest
    outputs:
      correlation_id: ${{ steps.tas.outputs.correlation_id }}
      run_url: ${{ steps.tas.outputs.run_url }}
    steps:
      - name: Run TAS
        id: tas
        uses: pagopa/pagopa-platform-integration-test/.github/actions/tas-integration-tests@main
        with:
          test_type: integration
          suite: fdr3
          environment: ${{ inputs.environment || 'dev' }}
          mode: sync
          ref: main
          tags: ${{ inputs.tags || '@runnable' }}
          github_token: ${{ secrets.INTEGRATION_TEST_PAT }}

  notify:
    needs: [ integration_test ]
    runs-on: ubuntu-latest
    name: Notify
    # Scheduled runs always notify; manual runs only when requested.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.notify) }}
    steps:
      - name: Report Status
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
        with:
          status: ${{ needs.integration_test.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notify_when: 'failure,skipped'
          notification_title: '<{run_url}|Scheduled Integration Test (via TAS)> has {status_message} - <${{ needs.integration_test.outputs.run_url }}|TAS run>'
          message_format: '{emoji} <{run_url}|{workflow}> {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked to <{workflow_url}| workflow file>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_INTEGRATION_TEST }}

